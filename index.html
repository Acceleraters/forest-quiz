<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2D5F2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="森林刷题册" />
  <title>森林刷题册｜毛概/习概题库网页程序</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile-v15.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" onclick="App.nav('home')">
        <span class="pixel-icon">📗</span>
        <div>
          <strong>森林刷题册</strong>
          <small>毛概 / 习概 双题库</small>
        </div>
      </div>
      <button class="icon-btn" onclick="App.nav('settings')" aria-label="设置">⚙️</button>
    </header>

    <main id="app" class="screen"></main>

    <div id="navDockAnchor" class="nav-dock-anchor" aria-hidden="true"></div>

    <nav class="bottom-nav" aria-label="底部快捷导航">
      <button onclick="App.nav('home')" data-tab="home">
        <span class="nav-badge" id="navHomeBadge"></span>
        <span class="nav-ico nav-ico-home" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M3 10.8 12 4l9 6.8v8.1a1.1 1.1 0 0 1-1.1 1.1H4.1A1.1 1.1 0 0 1 3 18.9z" fill="#EAF6E8" stroke="#2E6B3F" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M6.2 10.4 12 6l5.8 4.4" fill="none" stroke="#2E6B3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 14.5 12 9l4 5.5" fill="#61B15A" stroke="#2E6B3F" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M10.2 20v-3.9a1 1 0 0 1 1-1h1.6a1 1 0 0 1 1 1V20" fill="#FFF3BF" stroke="#2E6B3F" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="nav-label">营地</span>
      </button>
      <button onclick="App.nav('mode')" data-tab="mode">
        <span class="nav-badge" id="navModeBadge"></span>
        <span class="nav-ico nav-ico-mode" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <circle cx="12" cy="12" r="8.4" fill="#FFF6D8" stroke="#8A6330" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="2.2" fill="#FFFFFF" stroke="#8A6330" stroke-width="1.4"/>
            <path d="M13.1 10.9 16.9 7.2l-1.8 5.2-5.3 1.7z" fill="#FF8F52" stroke="#8A6330" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M12 5.5v1.6M12 16.9v1.6M18.5 12h-1.6M7.1 12H5.5" stroke="#8A6330" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="nav-label">冒险</span>
      </button>
      <button onclick="App.nav('wrong')" data-tab="wrong">
        <span class="nav-badge" id="navWrongBadge"></span>
        <span class="nav-ico nav-ico-wrong" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M7.5 4.8h9a1.8 1.8 0 0 1 1.8 1.8v12.6a1.8 1.8 0 0 1-1.8 1.8h-9a1.8 1.8 0 0 1-1.8-1.8V6.6a1.8 1.8 0 0 1 1.8-1.8z" fill="#FF6B6B" stroke="#8F2E2E" stroke-width="1.6"/>
            <path d="M9 8.2h6M9 11.5h6M9 14.8h4.2" stroke="#FFF3F3" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M9.2 4h5.6" stroke="#8F2E2E" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="nav-label">错题</span>
      </button>
      <button onclick="App.nav('memory')" data-tab="memory">
        <span class="nav-badge" id="navMemoryBadge"></span>
        <span class="nav-ico nav-ico-memory" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="m12 3.8 6.6 7.2-6.6 9.2L5.4 11z" fill="#52B7FF" stroke="#1B6EA8" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 3.8 9.4 11 12 20.2 14.6 11z" fill="#B9ECFF" stroke="#1B6EA8" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M5.4 11h13.2" stroke="#1B6EA8" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M8.1 7.3h7.8" stroke="#DFF7FF" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
          </svg>
        </span>
        <span class="nav-label">记忆</span>
      </button>
    </nav>
  </div>

  <div id="answerDock"></div>
  <div id="dialogs"></div>
  <script src="./data/question-banks.js"></script>
  <script src="./app.js"></script>
</body>
</html>
